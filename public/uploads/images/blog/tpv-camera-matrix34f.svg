<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Matrix34f layout: row-major 3x4 storage with the basis vectors held in the columns and the translation in column 3">
  <rect width="760" height="372" rx="8" fill="#282a36"/>

  <text x="380" y="34" fill="#f8f8f2" font-size="15" font-weight="600" text-anchor="middle">Matrix34f: row-major storage, column-vector basis</text>
  <text x="380" y="54" fill="#6272a4" font-size="12" text-anchor="middle">float m[3][4] — rows are contiguous in memory, but the axes read DOWN the columns</text>

  <!-- column headers -->
  <text x="203" y="88" fill="#8be9fd" font-size="12" font-weight="600" text-anchor="middle">col 0 · Right</text>
  <text x="333" y="88" fill="#50fa7b" font-size="12" font-weight="600" text-anchor="middle">col 1 · Forward</text>
  <text x="463" y="88" fill="#bd93f9" font-size="12" font-weight="600" text-anchor="middle">col 2 · Up</text>
  <text x="593" y="88" fill="#ffb86c" font-size="12" font-weight="600" text-anchor="middle">col 3 · Translation</text>

  <!-- column tints -->
  <rect x="140" y="98" width="126" height="184" rx="4" fill="#8be9fd" fill-opacity="0.09"/>
  <rect x="270" y="98" width="126" height="184" rx="4" fill="#50fa7b" fill-opacity="0.09"/>
  <rect x="400" y="98" width="126" height="184" rx="4" fill="#bd93f9" fill-opacity="0.09"/>
  <rect x="530" y="98" width="126" height="184" rx="4" fill="#ffb86c" fill-opacity="0.12"/>

  <!-- row 0 -->
  <text x="128" y="128" fill="#6272a4" font-size="11.5" text-anchor="end">row 0 · +0x00</text>
  <text x="203" y="122" fill="#6272a4" font-size="10.5" text-anchor="middle">m[0][0]</text>
  <text x="203" y="140" fill="#8be9fd" font-size="14" text-anchor="middle">R.x</text>
  <text x="333" y="122" fill="#6272a4" font-size="10.5" text-anchor="middle">m[0][1]</text>
  <text x="333" y="140" fill="#50fa7b" font-size="14" text-anchor="middle">F.x</text>
  <text x="463" y="122" fill="#6272a4" font-size="10.5" text-anchor="middle">m[0][2]</text>
  <text x="463" y="140" fill="#bd93f9" font-size="14" text-anchor="middle">U.x</text>
  <text x="593" y="122" fill="#6272a4" font-size="10.5" text-anchor="middle">m[0][3] · +0x0C</text>
  <text x="593" y="140" fill="#ffb86c" font-size="14" text-anchor="middle">P.x</text>

  <!-- row 1 -->
  <text x="128" y="188" fill="#6272a4" font-size="11.5" text-anchor="end">row 1 · +0x10</text>
  <text x="203" y="182" fill="#6272a4" font-size="10.5" text-anchor="middle">m[1][0]</text>
  <text x="203" y="200" fill="#8be9fd" font-size="14" text-anchor="middle">R.y</text>
  <text x="333" y="182" fill="#6272a4" font-size="10.5" text-anchor="middle">m[1][1]</text>
  <text x="333" y="200" fill="#50fa7b" font-size="14" text-anchor="middle">F.y</text>
  <text x="463" y="182" fill="#6272a4" font-size="10.5" text-anchor="middle">m[1][2]</text>
  <text x="463" y="200" fill="#bd93f9" font-size="14" text-anchor="middle">U.y</text>
  <text x="593" y="182" fill="#6272a4" font-size="10.5" text-anchor="middle">m[1][3] · +0x1C</text>
  <text x="593" y="200" fill="#ffb86c" font-size="14" text-anchor="middle">P.y</text>

  <!-- row 2 -->
  <text x="128" y="248" fill="#6272a4" font-size="11.5" text-anchor="end">row 2 · +0x20</text>
  <text x="203" y="242" fill="#6272a4" font-size="10.5" text-anchor="middle">m[2][0]</text>
  <text x="203" y="260" fill="#8be9fd" font-size="14" text-anchor="middle">R.z</text>
  <text x="333" y="242" fill="#6272a4" font-size="10.5" text-anchor="middle">m[2][1]</text>
  <text x="333" y="260" fill="#50fa7b" font-size="14" text-anchor="middle">F.z</text>
  <text x="463" y="242" fill="#6272a4" font-size="10.5" text-anchor="middle">m[2][2]</text>
  <text x="463" y="260" fill="#bd93f9" font-size="14" text-anchor="middle">U.z</text>
  <text x="593" y="242" fill="#6272a4" font-size="10.5" text-anchor="middle">m[2][3] · +0x2C</text>
  <text x="593" y="260" fill="#ffb86c" font-size="14" text-anchor="middle">P.z</text>

  <!-- grid lines -->
  <g stroke="#44475a" stroke-width="1">
    <line x1="140" y1="98" x2="656" y2="98"/>
    <line x1="140" y1="158" x2="656" y2="158"/>
    <line x1="140" y1="218" x2="656" y2="218"/>
    <line x1="140" y1="282" x2="656" y2="282"/>
    <line x1="140" y1="98" x2="140" y2="282"/>
    <line x1="266" y1="98" x2="266" y2="282"/>
    <line x1="396" y1="98" x2="396" y2="282"/>
    <line x1="526" y1="98" x2="526" y2="282"/>
    <line x1="656" y1="98" x2="656" y2="282"/>
  </g>

  <text x="380" y="312" fill="#f8f8f2" font-size="12.5" text-anchor="middle">The camera position is column 3, so the three writes land 0x10 apart.</text>
  <text x="380" y="336" fill="#ff5555" font-size="12" text-anchor="middle">Store the basis in the ROWS instead and you get the transpose: the inverse rotation, facing backwards.</text>
</svg>
