<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Top-down diagram of crosshair parallax: the shoulder offset and the combined focus plus follow distance form a right triangle whose angle is the aiming error">
  <rect width="760" height="330" rx="8" fill="#282a36"/>
  <defs>
    <marker id="ar-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f8f8f2"/>
    </marker>
    <marker id="ar-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8be9fd"/>
    </marker>
  </defs>

  <text x="380" y="32" fill="#f8f8f2" font-size="14" font-weight="600" text-anchor="middle">Why the crosshair can only be exact at one depth</text>

  <!-- aim ray: eye -> target, dead straight -->
  <line x1="200" y1="150" x2="706" y2="150" stroke="#f8f8f2" stroke-width="2" marker-end="url(#ar-w)"/>
  <text x="596" y="142" fill="#f8f8f2" font-size="11.5">aim ray (from the eye)</text>

  <!-- camera axis: camera -> focus -> beyond. Exact at F, diverging after. -->
  <line x1="60" y1="215" x2="400" y2="150" stroke="#8be9fd" stroke-width="2"/>
  <line x1="400" y1="150" x2="706" y2="92" stroke="#8be9fd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar-c)"/>
  <text x="560" y="104" fill="#8be9fd" font-size="11.5">camera forward = screen centre</text>

  <!-- reference line parallel to the aim, for the angle -->
  <line x1="60" y1="215" x2="330" y2="215" stroke="#6272a4" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- angle arc at the camera -->
  <path d="M 160 215 A 100 100 0 0 0 158 196" fill="none" stroke="#ffb86c" stroke-width="2"/>
  <text x="172" y="200" fill="#ffb86c" font-size="12">error</text>

  <!-- the divergence past the focus -->
  <line x1="690" y1="150" x2="690" y2="95" stroke="#ff5555" stroke-width="2"/>
  <text x="682" y="176" fill="#ff5555" font-size="11.5" text-anchor="end">what you point at vs. what you hit</text>

  <!-- focus point -->
  <circle cx="400" cy="150" r="6" fill="#50fa7b"/>
  <text x="400" y="134" fill="#50fa7b" font-size="11.5" text-anchor="middle">focus point: exact HERE</text>

  <!-- eye and player -->
  <circle cx="200" cy="150" r="5" fill="#f8f8f2"/>
  <text x="200" y="134" fill="#f8f8f2" font-size="11" text-anchor="middle">eye</text>
  <circle cx="176" cy="150" r="7" fill="#f1fa8c"/>
  <text x="150" y="136" fill="#f1fa8c" font-size="11" text-anchor="middle">player</text>

  <!-- camera -->
  <rect x="51" y="208" width="18" height="14" rx="3" fill="#8be9fd"/>
  <text x="60" y="243" fill="#8be9fd" font-size="11" text-anchor="middle">camera</text>

  <!-- S : the shoulder offset (lateral leg) -->
  <line x1="30" y1="150" x2="30" y2="215" stroke="#bd93f9" stroke-width="1.5"/>
  <line x1="25" y1="150" x2="35" y2="150" stroke="#bd93f9" stroke-width="1.5"/>
  <line x1="25" y1="215" x2="35" y2="215" stroke="#bd93f9" stroke-width="1.5"/>
  <text x="44" y="186" fill="#bd93f9" font-size="12">S</text>

  <!-- follow + focus : the long leg -->
  <line x1="60" y1="280" x2="400" y2="280" stroke="#bd93f9" stroke-width="1.5"/>
  <line x1="60" y1="275" x2="60" y2="285" stroke="#bd93f9" stroke-width="1.5"/>
  <line x1="200" y1="275" x2="200" y2="285" stroke="#bd93f9" stroke-width="1.5"/>
  <line x1="400" y1="275" x2="400" y2="285" stroke="#bd93f9" stroke-width="1.5"/>
  <text x="130" y="272" fill="#bd93f9" font-size="11.5" text-anchor="middle">follow d</text>
  <text x="300" y="272" fill="#bd93f9" font-size="11.5" text-anchor="middle">focus f</text>

  <text x="380" y="310" fill="#f8f8f2" font-size="13" text-anchor="middle">error = atan( S / (f + d) )   —   widen the bottom leg and the angle shrinks</text>
</svg>
